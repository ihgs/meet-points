name: Visual Regression Test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "baseline を再生成してこのブランチにコミット"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: write
jobs:
  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # baseline コミット時に push できるように
          token: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline == 'true' && secrets.GITHUB_TOKEN || github.token }}
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Playwright ブラウザのインストール
        run: pnpm exec playwright install --with-deps chromium
      - name: VRT 実行（baseline 比較）
        if: github.event_name == 'pull_request' || inputs.update_baseline != 'true'
        run: pnpm test:vrt
      - name: 失敗時に diff/actual を artifact にアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diff
          # vitest は diff/actual を `.vitest-attachments/` 配下に書き出す
          path: |
            .vitest-attachments/**/*-actual-*.png
            .vitest-attachments/**/*-diff-*.png
            .vitest-attachments/**/*-reference-*.png
          if-no-files-found: warn
      - name: baseline 再生成
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline == 'true'
        # 古い baseline（過去ランの非同期な更新で混在しうる）を一掃してから新規生成する
        run: |
          find . -path ./node_modules -prune -o -type d -name __screenshots__ -print -exec rm -rf {} +
          pnpm test:vrt:update
      - name: baseline をコミット
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `**` は git pathspec デフォルトで効かないので glob magic で再帰マッチさせる
          git add ':(glob)**/__screenshots__/**'
          if git diff --cached --quiet; then
            echo "baseline に変更なし"
          else
            git commit -m "VRT baseline 再生成 ($(date -u +%Y-%m-%d))"
            git push
          fi
